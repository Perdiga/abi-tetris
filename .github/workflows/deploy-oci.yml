name: Deploy to OCI VM
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read }
concurrency: { group: oci-production-deploy, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint && npm test && npm run build
      - name: Configure SSH
        env: { DEPLOY_KEY: ${{ secrets.OCI_VM_DEPLOY_SSH_PRIVATE_KEY }}, VM_HOST_KEY: ${{ secrets.OCI_VM_SSH_HOST_KEY }} }
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VM_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Publish site
        env: { VM_HOST: ${{ secrets.OCI_VM_HOST }} }
        run: rsync -az --delete -e 'ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=yes' dist/ ubuntu@"$VM_HOST":/var/www/abi-tetris/
