name: OCI infrastructure

on:
  workflow_dispatch:
    inputs:
      action:
        description: Operacao Terraform
        type: choice
        required: true
        default: plan
        options: [plan, apply]

permissions:
  contents: read

concurrency:
  group: oci-infrastructure
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: infrastructure
    env:
      TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
      TF_VAR_user_ocid: ${{ secrets.OCI_USER_OCID }}
      TF_VAR_fingerprint: ${{ secrets.OCI_FINGERPRINT }}
      TF_VAR_region: ${{ secrets.OCI_REGION }}
      TF_VAR_compartment_ocid: ${{ secrets.OCI_COMPARTMENT_OCID }}
      TF_VAR_ssh_public_key: ${{ secrets.OCI_VM_DEPLOY_SSH_PUBLIC_KEY }}
      TF_STATE_BUCKET: ${{ secrets.OCI_TF_STATE_BUCKET }}
      OCI_NAMESPACE: ${{ secrets.OCI_NAMESPACE }}
      OCI_TF_STATE_ACCESS_KEY: ${{ secrets.OCI_TF_STATE_ACCESS_KEY }}
      OCI_TF_STATE_SECRET_KEY: ${{ secrets.OCI_TF_STATE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure OCI API signing key
        env:
          OCI_API_KEY: ${{ secrets.OCI_API_KEY }}
        run: |
          printf '%s' "$OCI_API_KEY" > "$RUNNER_TEMP/oci_api_key.pem"
          chmod 600 "$RUNNER_TEMP/oci_api_key.pem"
          echo "TF_VAR_private_key_path=$RUNNER_TEMP/oci_api_key.pem" >> "$GITHUB_ENV"
      - name: Initialize Terraform state backend
        run: |
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=abi-tetris/terraform.tfstate" \
            -backend-config="region=$TF_VAR_region" \
            -backend-config="access_key=$OCI_TF_STATE_ACCESS_KEY" \
            -backend-config="secret_key=$OCI_TF_STATE_SECRET_KEY" \
            -backend-config="endpoints={s3=\"https://$OCI_NAMESPACE.compat.objectstorage.$TF_VAR_region.oraclecloud.com\"}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_metadata_api_check=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="use_path_style=true"
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - run: terraform plan -out=tfplan
      - if: inputs.action == 'apply'
        run: terraform apply -auto-approve tfplan
