#cloud-config
package_update: true
packages: [nginx]
runcmd:
  - mkdir -p /var/www/abi-tetris
  - chown -R ubuntu:ubuntu /var/www/abi-tetris
  - rm -f /etc/nginx/sites-enabled/default
  - "printf 'server { listen 80 default_server; server_name _; root /var/www/abi-tetris; index index.html; location / { try_files $uri $uri/ /index.html; } }' > /etc/nginx/sites-available/abi-tetris"
  - ln -s /etc/nginx/sites-available/abi-tetris /etc/nginx/sites-enabled/abi-tetris
  - nginx -t
  - systemctl enable --now nginx
